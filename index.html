let data=load();let page='home';let unlocked=false;let cursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);let calFilter='all';let modalState=null;let history=[],future=[];
function clone(x){return JSON.parse(JSON.stringify(x))}function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(oldKey);if(raw){let d=JSON.parse(raw);return normalize(d)}}catch(e){}return clone(starter)}

function startClock(){
  const tick=()=>{
    const d=new Date(); let h=d.getHours()%12||12, hs=String(h).padStart(2,'0'), ms=String(d.getMinutes()).padStart(2,'0');
    document.querySelectorAll('[data-flip-key]').forEach(el=>{let key=el.dataset.flipKey;let value=key.startsWith('h')?hs[Number(key.slice(1))]:ms[Number(key.slice(1))];el.textContent=value||'0'});
    document.querySelectorAll('[data-ampm]').forEach(el=>el.textContent=d.getHours()>=12?'PM':'AM');
    let x=document.getElementById('date');if(x)x.textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  };tick();clearInterval(window.__clock);window.__clock=setInterval(tick,1000)
}
function startFlipClock(){startClock()}
function flipDigit(kind,index){return `<div class="flip-digit"><div class="top" data-flip-key="${kind}${index}">0</div><div class="bottom" data-flip-key="${kind}${index}">0</div></div>`}

function miniCalendarBlock(){
  let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let c=['S','M','T','W','T','F','S'].map(function(x){return '<b>'+x+'</b>'}).join('');
  for(let i=0;i<first;i++)c+='<span></span>';
  let now=new Date();
  for(let d=1;d<=days;d++){
    let date=iso(y,m+1,d),today=date===iso(now.getFullYear(),now.getMonth()+1,now.getDate()),has=data.events.some(function(e){return e.date===date});
    c+='<button class="'+(today?'today ':'')+(has?'has':'')+'" onclick="openDay(\''+date+'\')">'+d+'</button>';
  }
  return widgetBlock({id:'mini-cal',title:data.homeCalTitle||'CALENDAR',w:4},
    '<div class="calendar-mini"><div class="cal-mini-head"><button onclick="moveMonth(-1)">‹</button><strong>'+cursor.toLocaleString(undefined,{month:'long'})+'</strong><button onclick="moveMonth(1)">›</button></div><div class="cal-mini-grid">'+c+'</div><div class="muted" style="margin-top:9px;text-align:center">school + personal</div></div>');
}

function saveCustom(id){
  let w=data.widgets.find(function(x){return x.id===id});if(!w)return;checkpoint();
  w.title=document.getElementById('cwTitle').value.trim()||'WIDGET';w.w=Number(document.getElementById('cwWidth').value);
  if(w.type==='image')w.image=document.getElementById('cwImage').value.trim();
  if(w.type==='embed'){w.url=document.getElementById('cwUrl').value.trim();w.embed=document.getElementById('cwEmbed').value==='1'}
  if(w.type==='countdown'){w.name=document.getElementById('cwName').value.trim()||'My countdown';w.date=document.getElementById('cwDate').value}
  if(w.type==='text')w.text=document.getElementById('cwText').value;

function calendarPage(){

function openPrompt(title,label,value,cb){modalState={type:'prompt',cb};openModal(`<div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>${esc(label)}</label><textarea id="prompt" style="min-height:${String(value).length>100?'130px':'70px'}">${esc(value)}</textarea></div></div><div class="modal-foot"><button class="soft-btn" onclick="closeModal()">cancel</button><button class="soft-btn" onclick="finishPrompt()">save</button></div>`)}function finishPrompt(){let v=document.getElementById('prompt').value,cb=modalState.cb;closeModal();cb(v)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('backdrop').classList.add('open')}function closeModal(){document.getElementById('backdrop').classList.remove('open');modalState=null}function backdropClose(e){if(e.target.id==='backdrop')closeModal()}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Escape'&&document.getElementById('backdrop').classList.contains('open'))closeModal()});
function todayISO(){let d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
save();render();
