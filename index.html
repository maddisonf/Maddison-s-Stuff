<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maddison's Stuff — Custom Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;600;700&display=swap');
:root{--bg:#fffaf4;--ink:#3d3130;--primary:#f6dfe3;--secondary:#d7f7c8;--accent:#e66da9;--card:#fff;--muted:#765f57;--radius:12px;--base:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Libre Baskerville',serif;color:var(--ink);font-size:var(--base)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top-strip{height:54px;background:repeating-linear-gradient(90deg,#f7b9ca 0 5px,#fff4dc 5px 13px,#c9dfb7 13px 18px,#fff7e7 18px 26px,#e8a9c2 26px 31px);border-bottom:2px solid #f2d6dc}
.shell{max-width:1400px;margin:auto;padding:0 28px 60px}.header{margin:0 -28px;padding:20px 28px 28px;min-height:210px;position:relative;overflow:hidden;background:linear-gradient(110deg,#cddfbf,#e6e9c8 45%,#d7e4be)}
.header-title{position:relative;text-align:center;padding-top:12px;font-family:'Playfair Display';font-size:64px;line-height:.95;color:#e9a6bc;text-shadow:2px 2px 0 #8f5d61,-1px -1px 0 #fff}.header-sub{text-align:center;margin-top:12px;font-family:'DM Mono';font-size:12px;letter-spacing:2px}
.header-actions{position:absolute;right:24px;top:20px;display:flex;gap:8px;flex-wrap:wrap}.page-title{text-align:center;font-family:'DM Mono';letter-spacing:6px;font-size:24px;margin:30px 0}
.layout{display:grid;grid-template-columns:220px 1fr;gap:26px}.sidebar{padding-top:4px}.side-btn,.side-link{display:block;width:100%;border:0;text-align:left;background:var(--primary);padding:10px 12px;margin-bottom:10px;border-radius:8px;text-decoration:none;font-size:13px}.side-link{background:transparent;text-decoration:underline}.side-heading,.section-label{font-weight:bold;font-size:13px;background:#f8e6e2;border-radius:7px;padding:8px 10px;margin:14px 0 10px}
.card{border-radius:var(--radius);padding:20px;background:var(--card);box-shadow:0 2px 0 rgba(100,60,50,.06);border:1px solid rgba(100,60,50,.06)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.quick-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px}.big-number{font-family:'DM Mono';font-size:42px;color:#a47762}.quote{font-family:'Playfair Display';font-size:21px;line-height:1.3}.btn{border:0;background:#fff0f5;border-radius:8px;padding:9px 12px;color:#633e4c}.btn:hover{background:#f7d4e2}.primary{background:var(--accent);color:white}.danger{background:#f6c7c7}.muted{color:var(--muted);font-size:12px}.class-card{min-height:250px;display:flex;flex-direction:column}.class-art{height:145px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:76px;background:#dcecf7;margin-bottom:14px}.class-name{font-weight:bold;font-size:15px;margin-bottom:9px}.mini-progress,.progress-large{height:9px;background:#fff;border-radius:99px;overflow:hidden}.mini-progress i,.progress-large i{display:block;height:100%;background:var(--accent);border-radius:99px}.meta{display:flex;justify-content:space-between;font-size:11px;margin-top:6px}.home-calendar{background:var(--secondary);padding:18px;border-radius:var(--radius)}.month{text-align:center;font-family:'DM Mono';margin-bottom:12px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px}.cal span,.cal b{padding:7px 2px}.today{background:#a57a66;color:#fff;border-radius:50%}
.dashboard-top{display:grid;grid-template-columns:1fr;gap:18px}.overall{background:var(--secondary);padding:22px;border-radius:var(--radius)}.stat-box{background:#eee5f5;padding:18px;border-radius:var(--radius);text-align:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.assignment{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;background:#fff8f5;border:1px solid #f0deda;border-radius:10px;padding:12px;margin-bottom:9px}.assignment.done{opacity:.55}.assignment.done .assignment-title{text-decoration:line-through}.assignment-title{font-weight:bold;font-size:13px}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#dcecf7}.tag.high{background:#f4c4cf}.tag.medium{background:#f8efc9}.tag.low{background:#d7f7c8}
.add-box{display:grid;grid-template-columns:1.4fr 1fr 150px 140px auto;gap:7px;background:#f8eee9;padding:12px;border-radius:10px;margin-bottom:14px}input,select,textarea{border:1px solid #e6d1cc;border-radius:7px;padding:9px;background:#fff;width:100%}textarea{min-height:110px;resize:vertical}.hidden{display:none!important}.class-page-head{display:flex;justify-content:space-between;gap:15px;background:var(--primary);padding:20px;border-radius:var(--radius);margin-bottom:16px}.event{padding:10px;border-radius:9px;background:#fff;border:1px solid #eadbd6;margin-bottom:8px}.event.school{border-left:5px solid #8dbbde}.event.life{border-left:5px solid #e68bb0}.event.other{border-left:5px solid #9ac38f}.countdown{padding:14px;border-radius:10px;background:#f8e8e5;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.portfolio-item{min-height:160px;background:#eee5f5;border-radius:10px;padding:14px}.cover{height:130px;border-radius:10px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px;color:#fff;text-shadow:0 1px 4px #000;background-color:#c9b9d8}.editor{position:fixed;inset:0;background:rgba(40,30,30,.45);display:none;z-index:50}.editor.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(430px,95vw);background:#fffaf8;padding:20px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15)}.panel h2{margin-top:0}.setting{margin:12px 0}.setting label{display:block;font-size:12px;margin-bottom:5px}.swatches{display:flex;gap:8px}.swatches input{height:40px;padding:2px}.toast{position:fixed;bottom:18px;right:18px;background:#3d3130;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:80}
@media(max-width:950px){.layout{grid-template-columns:1fr}.grid,.portfolio-grid{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr}.header-title{font-size:46px}.header-actions{position:static;justify-content:center;margin-top:15px}.add-box{grid-template-columns:1fr 1fr}.shell{padding:0 16px 50px}.header{margin:0 -16px;padding:20px 16px 24px}.assignment{grid-template-columns:28px 1fr}.assignment .tag{display:none}}
</style>
</head>
<body>
<div class="top-strip"></div>
<div class="shell">
<header class="header">
  <div class="header-actions"><button class="btn" onclick="openEditor()">⚙ customize</button><button class="btn" onclick="addPage()">＋ page</button></div>
  <div class="header-title" id="siteTitle">maddison's<br>stuff</div>
  <div class="header-sub" id="siteSubtitle">school • life • creative things • everything</div>
</header>
<div class="page-title" id="title">❀⋆｡°✩ homepage ✩°｡⋆❀</div>

<div id="app"></div>
</div>

<div id="editor" class="editor" onclick="if(event.target.id==='editor')closeEditor()">
<div class="panel">
<h2>✿ customize everything</h2>
<p class="muted">Changes save automatically in this browser. This is designed to work as a single GitHub Pages HTML file.</p>
<div class="setting"><label>Site title</label><input id="setTitle" oninput="settings.siteTitle=this.value;applySettings()"></div>
<div class="setting"><label>Subtitle</label><input id="setSubtitle" oninput="settings.subtitle=this.value;applySettings()"></div>
<div class="setting"><label>Font</label><select id="setFont" onchange="settings.font=this.value;applySettings()"><option value="'Libre Baskerville',serif">Libre Baskerville</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Georgia</option><option value="'DM Mono',monospace">DM Mono</option><option value="'Playfair Display',serif">Playfair Display</option></select></div>
<div class="setting"><label>Base text size</label><input id="setSize" type="range" min="12" max="24" oninput="settings.size=this.value;applySettings()"></div>
<div class="setting"><label>Background</label><input id="setBg" type="color" oninput="settings.bg=this.value;applySettings()"></div>
<div class="setting"><label>Primary color</label><input id="setPrimary" type="color" oninput="settings.primary=this.value;applySettings()"></div>
<div class="setting"><label>Accent color</label><input id="setAccent" type="color" oninput="settings.accent=this.value;applySettings()"></div>
<div class="setting"><label>Card color</label><input id="setCard" type="color" oninput="settings.card=this.value;applySettings()"></div>
<div class="setting"><label>Corner roundness</label><input id="setRadius" type="range" min="0" max="30" oninput="settings.radius=this.value+'px';applySettings()"></div>
<hr>
<h3>Backup</h3>
<button class="btn" onclick="exportData()">⬇ export backup</button>
<button class="btn" onclick="document.getElementById('importFile').click()">⬆ import backup</button>
<input id="importFile" class="hidden" type="file" accept=".json" onchange="importData(event)">
<hr>
<button class="btn danger" onclick="resetAll()">reset this dashboard</button>
<button class="btn" onclick="closeEditor()">done</button>
</div></div>
<div id="toast" class="toast"></div>

<script>
const defaultState={
settings:{siteTitle:"maddison's stuff",subtitle:"school • life • creative things • everything",font:"'Libre Baskerville',serif",size:16,bg:"#fffaf4",primary:"#f6dfe3",accent:"#e66da9",card:"#ffffff",radius:"12px"},
pages:[
{id:"home",name:"Home",type:"home",cover:"",blocks:[]},
{id:"school",name:"School Dashboard",type:"school",cover:"",blocks:[]},
{id:"life",name:"My Life",type:"life",cover:"",blocks:[]},
{id:"portfolio",name:"Graphic Design Portfolio",type:"portfolio",cover:"",blocks:[]},
{id:"calendar",name:"Calendar",type:"calendar",cover:"",blocks:[]}
],
classes:[
{id:crypto.randomUUID(),name:"NCAPS Digital Media & Tech",art:"💻",color:"#dcecf7",desc:"digital media, technology & creative projects",website:"",notes:"",exam:"",assignments:[
{title:"Website homepage",due:"Aug 18",priority:"High",status:"In progress"},
{title:"Digital media reflection",due:"Aug 20",priority:"Medium",status:"Not started"},
{title:"Tech vocabulary",due:"Aug 21",priority:"Low",status:"Complete"},
{title:"Design project",due:"Aug 25",priority:"High",status:"Not started"}]},
{id:crypto.randomUUID(),name:"AP Language & Comp",art:"📖",color:"#f8e8e5",desc:"reading, writing, rhetoric & analysis",website:"",notes:"",exam:"",assignments:[
{title:"Summer reading response",due:"Aug 19",priority:"Medium",status:"Not started"},
{title:"Rhetorical analysis",due:"Aug 22",priority:"High",status:"Not started"},
{title:"Vocabulary quiz",due:"Aug 26",priority:"Medium",status:"Not started"},
{title:"Argument essay",due:"Aug 28",priority:"High",status:"Complete"}]},
{id:crypto.randomUUID(),name:"AP Statistics",art:"📄",color:"#e6eff7",desc:"probability, statistics & analysis",website:"",notes:"",exam:"",assignments:[
{title:"Chapter 1 practice",due:"Aug 18",priority:"Medium",status:"Not started"},
{title:"Statistical investigation",due:"Aug 23",priority:"High",status:"Not started"},
{title:"Chapter 1 quiz",due:"Aug 27",priority:"Medium",status:"Not started"},
{title:"Data analysis worksheet",due:"Aug 29",priority:"Low",status:"Not started"}]}],
events:[],
countdowns:[{name:"My Birthday",date:"2026-11-11"}],
quickLinks:[
{name:"Google Classroom",url:"https://classroom.google.com"},
{name:"ChatGPT",url:"https://chatgpt.com"}
],
portfolio:[
{name:"Portfolio Piece 1",description:"Add a project description and image.",image:""},
{name:"Portfolio Piece 2",description:"Add another college portfolio project.",image:""},
{name:"Portfolio Piece 3",description:"Showcase your favorite design work.",image:""}]
};
let state=JSON.parse(localStorage.getItem("maddisonNotionDashboard")||"null")||defaultState;
let currentPage="home",currentClass=null;

function save(){localStorage.setItem("maddisonNotionDashboard",JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function applySettings(){
 const s=state.settings; document.documentElement.style.setProperty("--bg",s.bg);document.documentElement.style.setProperty("--primary",s.primary);document.documentElement.style.setProperty("--accent",s.accent);document.documentElement.style.setProperty("--card",s.card);document.documentElement.style.setProperty("--radius",s.radius);document.documentElement.style.setProperty("--base",s.size+"px");
 document.body.style.fontFamily=s.font;document.getElementById("siteTitle").innerHTML=esc(s.siteTitle).replace("\\n","<br>");document.getElementById("siteSubtitle").textContent=s.subtitle;save();
}
function initSettings(){
 const s=state.settings;set("setTitle",s.siteTitle);set("setSubtitle",s.subtitle);set("setFont",s.font);set("setSize",s.size);set("setBg",s.bg);set("setPrimary",s.primary);set("setAccent",s.accent);set("setCard",s.card);set("setRadius",parseInt(s.radius));
}
function set(id,v){document.getElementById(id).value=v}
function openEditor(){initSettings();document.getElementById("editor").classList.add("open")}
function closeEditor(){document.getElementById("editor").classList.remove("open")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function pageNav(){return state.pages.map(p=>`<button class="side-btn" onclick="showPage('${p.id}')">${esc(p.name)}</button>`).join("")}
function renderSidebar(){
 return `<aside class="sidebar">${pageNav()}<div class="side-heading">QUICK LINKS <button class="btn" style="float:right;padding:3px 7px" onclick="addQuickLink()">＋</button></div>${state.quickLinks.map((l,i)=>`<a class="side-link" href="${esc(l.url)}" target="_blank">${esc(l.name)} ↗</a>`).join("")}<button class="side-link" onclick="editQuickLinks()">✎ edit links</button><div class="side-heading">PAGES</div><button class="side-link" onclick="managePages()">✎ manage pages</button></aside>`
}
function render(){
 const p=state.pages.find(x=>x.id===currentPage)||state.pages[0];currentPage=p.id;
 document.getElementById("title").innerHTML=`❀⋆｡°✩ <span>${esc(p.name.toLowerCase())}</span> ✩°｡⋆❀`;
 document.getElementById("app").innerHTML=renderSidebar()+`<main>${renderPage(p)}</main>`;
 if(p.type==="school")renderSchool();
 if(p.type==="calendar")renderCalendar();
}
function renderPage(p){
 let cover=p.cover?`<div class="cover" style="background-image:url('${esc(p.cover)}')"><button class="btn" onclick="editCover('${p.id}')">✎ cover</button></div>`:`<div style="display:flex;justify-content:flex-end"><button class="btn" onclick="editCover('${p.id}')">＋ page cover</button></div>`;
 if(p.type==="home")return `<div>${cover}<div class="quick-grid" style="margin-top:18px"><div class="card"><div class="section-label">TODAY</div><div class="big-number" id="clock"></div><div class="muted" id="date"></div><div class="quote" style="margin-top:20px">“make it cute, make it useful.”</div></div><div class="home-calendar"><div class="month" id="miniMonth"></div><div class="cal" id="miniCal"></div></div><div class="card" style="background:var(--secondary)"><div class="section-label">COUNTDOWNS</div>${state.countdowns.map(c=>`<div class="countdown"><span>${esc(c.name)}</span><b>${daysUntil(c.date)} days</b></div>`).join("")}<button class="btn" onclick="addCountdown()">＋ countdown</button></div></div><div class="section-label" style="margin-top:24px">YOUR PAGES</div><div class="grid">${state.pages.filter(x=>x.id!=="home").map(p=>`<div class="class-card card"><div class="class-art">✿</div><div class="class-name">${esc(p.name)}</div><div class="muted">Fully editable page</div><button class="btn" style="margin-top:auto" onclick="showPage('${p.id}')">open →</button></div>`).join("")}</div></div>`;
 if(p.type==="school")return `<div>${cover}<div class="dashboard-top"><div class="overall"><div class="section-label">SCHOOL DASHBOARD</div><div style="font-family:'Playfair Display';font-size:30px">you've got this ♡</div><div class="progress-large"><i id="overallBar"></i></div><div id="overallText"></div></div></div><div class="toolbar"><button class="btn primary" onclick="addClass()">＋ class</button><button class="btn" onclick="showPage('portfolio')">🎨 portfolio</button></div><div class="section-label">CLASSES</div><div class="grid" id="classGrid"></div></div>`;
 if(p.type==="life")return `<div>${cover}<div class="quick-grid"><div class="card" style="background:var(--secondary)"><div class="section-label">LIFE</div><div class="quote">Your space for goals, plans, memories, hobbies, and anything else.</div><button class="btn" onclick="addLifeNote()">＋ add note</button></div><div class="card"><div class="section-label">COUNTDOWNS</div>${state.countdowns.map((c,i)=>`<div class="countdown"><span>${esc(c.name)}</span><b>${daysUntil(c.date)}d</b><button class="btn danger" onclick="deleteCountdown(${i})">×</button></div>`).join("")}<button class="btn" onclick="addCountdown()">＋ add</button></div><div class="card"><div class="section-label">QUICK EVENTS</div><button class="btn" onclick="addEvent()">＋ event</button><div style="margin-top:10px">${state.events.filter(e=>e.category==="life").slice(0,5).map(eventHTML).join("")}</div></div></div></div>`;
 if(p.type==="portfolio")return `<div>${cover}<div class="toolbar"><button class="btn primary" onclick="addPortfolio()">＋ portfolio piece</button><button class="btn" onclick="editPageText('${p.id}')">✎ edit page text</button></div><div class="portfolio-grid">${state.portfolio.map((x,i)=>`<div class="portfolio-item">${x.image?`<div class="cover" style="height:100px;background-image:url('${esc(x.image)}')"></div>`:"🎨"}<b>${esc(x.name)}</b><p class="muted">${esc(x.description)}</p><button class="btn" onclick="editPortfolio(${i})">edit</button><button class="btn danger" onclick="deletePortfolio(${i})">delete</button></div>`).join("")}</div></div>`;
 if(p.type==="calendar")return `<div>${cover}<div class="toolbar"><button class="btn primary" onclick="addEvent()">＋ event</button><button class="btn" onclick="addCountdown()">＋ countdown</button></div><div class="section-label">ALL EVENTS</div><div id="eventList"></div></div>`;
 return `<div>${cover}<div class="card"><h2>${esc(p.name)}</h2><textarea id="pageText" placeholder="Write anything here..."></textarea><button class="btn" onclick="savePageText('${p.id}')">save</button></div></div>`;
}
function renderSchool(){
 const all=state.classes.flatMap(c=>c.assignments),done=all.filter(a=>a.status==="Complete").length,p=all.length?Math.round(done/all.length*100):0;
 document.getElementById("overallBar").style.width=p+"%";document.getElementById("overallText").textContent=`${done} of ${all.length} assignments complete • ${p}%`;
 document.getElementById("classGrid").innerHTML=state.classes.map((c,i)=>{let d=c.assignments.filter(a=>a.status==="Complete").length,cp=c.assignments.length?Math.round(d/c.assignments.length*100):0;return `<div class="class-card card"><div class="class-art" style="background:${esc(c.color)}">${esc(c.art)}</div><div class="class-name">${esc(c.name)}</div><div class="muted">${esc(c.desc)}</div><div class="mini-progress" style="margin-top:10px"><i style="width:${cp}%"></i></div><div class="meta"><span>${d}/${c.assignments.length} complete</span><b>${cp}%</b></div><button class="btn" style="margin-top:auto" onclick="openClass(${i})">open class →</button><button class="btn" onclick="editClass(${i})">edit class</button></div>`}).join("");
}
function openClass(i){currentClass=i;const c=state.classes[i];const p=state.pages.find(x=>x.type==="school");document.getElementById("app").innerHTML=renderSidebar()+`<main><button class="btn back" onclick="showPage('school')">← school</button><div class="class-page-head"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.desc)}</div>${c.website?`<a href="${esc(c.website)}" target="_blank">class website ↗</a>`:""}</div><button class="btn" onclick="editClass(${i})">✎ edit</button></div><div class="card" style="margin-bottom:15px"><b>EXAM DATE</b><p>${esc(c.exam||"Not added")}</p><b>CLASS NOTES</b><p style="white-space:pre-wrap">${esc(c.notes||"No notes yet.")}</p></div><div class="add-box"><input id="atitle" placeholder="assignment name"><input id="adue" placeholder="due date"><select id="apri"><option>High</option><option selected>Medium</option><option>Low</option></select><select id="astatus"><option>Not started</option><option>In progress</option><option>Complete</option></select><button class="btn primary" onclick="addAssignment()">＋ add</button></div><div id="assignments"></div></main>`;renderAssignments()}
function renderAssignments(){const c=state.classes[currentClass];document.getElementById("assignments").innerHTML=c.assignments.map((a,i)=>`<div class="assignment ${a.status==="Complete"?"done":""}"><input type="checkbox" ${a.status==="Complete"?"checked":""} onchange="toggleAssignment(${i})"><div><div class="assignment-title">${esc(a.title)}</div><div class="muted">due ${esc(a.due||"—")} • ${esc(a.status)}</div></div><span class="tag ${a.priority.toLowerCase()}">${esc(a.priority)}</span><button class="btn danger" onclick="deleteAssignment(${i})">delete</button></div>`).join("")||`<div class="card">No assignments yet.</div>`}
function addAssignment(){let c=state.classes[currentClass],title=document.getElementById("atitle").value.trim();if(!title)return;c.assignments.push({title,due:document.getElementById("adue").value,priority:document.getElementById("apri").value,status:document.getElementById("astatus").value});save();openClass(currentClass)}
function toggleAssignment(i){let a=state.classes[currentClass].assignments[i];a.status=a.status==="Complete"?"Not started":"Complete";save();openClass(currentClass)}
function deleteAssignment(i){state.classes[currentClass].assignments.splice(i,1);save();openClass(currentClass)}
function editClass(i){let c=state.classes[i],name=prompt("Class name:",c.name);if(name===null)return;c.name=name;c.desc=prompt("Class description:",c.desc)||"";c.website=prompt("Class website URL:",c.website)||"";c.exam=prompt("Exam date:",c.exam)||"";c.notes=prompt("Class notes:",c.notes)||"";c.art=prompt("Cover emoji/icon:",c.art)||"📚";save();render()}
function addClass(){state.classes.push({id:crypto.randomUUID(),name:"New Class",art:"📚",color:"#eee5f5",desc:"Add your class description",website:"",notes:"",exam:"",assignments:[]});save();render()}
function eventHTML(e,i){return `<div class="event ${esc(e.category)}"><b>${esc(e.title)}</b><div class="muted">${esc(e.date)} • ${esc(e.time||"")} • ${esc(e.category)}</div><button class="btn" onclick="editEvent(${i})">edit</button><button class="btn danger" onclick="deleteEvent(${i})">delete</button></div>`}
function renderCalendar(){document.getElementById("eventList").innerHTML=state.events.map(eventHTML).join("")||`<div class="card">No events yet. Add school, life, or other events.</div>`}
function addEvent(){let title=prompt("Event name:");if(!title)return;let date=prompt("Date (e.g. Aug 20):","");let category=prompt("Category: school / life / other","school");let time=prompt("Time (optional):","");state.events.push({title,date,time,category:["school","life","other"].includes(category)?category:"other"});save();render()}
function editEvent(i){let e=state.events[i];e.title=prompt("Event name:",e.title)||e.title;e.date=prompt("Date:",e.date)||e.date;e.time=prompt("Time:",e.time)||e.time;e.category=prompt("Category:",e.category)||e.category;save();render()}
function deleteEvent(i){state.events.splice(i,1);save();render()}
function addCountdown(){let name=prompt("Countdown name:");if(!name)return;let date=prompt("Date (YYYY-MM-DD):");if(!date)return;state.countdowns.push({name,date});save();render()}
function deleteCountdown(i){state.countdowns.splice(i,1);save();render()}
function daysUntil(date){return Math.max(0,Math.ceil((new Date(date+"T00:00:00")-new Date())/86400000))}
function addQuickLink(){let name=prompt("Link name:");if(!name)return;let url=prompt("URL:","https://");if(!url)return;state.quickLinks.push({name,url});save();render()}
function editQuickLinks(){state.quickLinks.forEach((l,i)=>{let n=prompt("Link "+(i+1)+" name (leave blank to delete):",l.name);if(n===null)return;if(!n){state.quickLinks.splice(i,1)}else{l.name=n;l.url=prompt("URL:",l.url)||l.url}});save();render()}
function addPage(){let name=prompt("New page name:");if(!name)return;let id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now();state.pages.push({id,name,type:"custom",cover:"",blocks:[]});save();showPage(id)}
function managePages(){state.pages.forEach((p,i)=>{if(p.id==="home")return;let n=prompt("Rename page (leave blank to delete):",p.name);if(n===null)return;if(!n)state.pages.splice(i,1);else p.name=n});save();render()}
function editCover(id){let p=state.pages.find(x=>x.id===id);p.cover=prompt("Paste an image URL for this page cover (or leave blank for none):",p.cover)||"";save();render()}
function editPageText(id){let p=state.pages.find(x=>x.id===id);let t=prompt("Page text:",p.text||"");if(t!==null){p.text=t;save();render()}}
function savePageText(id){let p=state.pages.find(x=>x.id===id);p.text=document.getElementById("pageText").value;save();toast("Saved!")}
function addLifeNote(){let t=prompt("What do you want to add?");if(!t)return;state.pages.find(p=>p.type==="life").text=(state.pages.find(p=>p.type==="life").text||"")+"\n"+t;save();toast("Added!")}
function addPortfolio(){let n=prompt("Project name:");if(!n)return;state.portfolio.push({name:n,description:prompt("Description:")||"",image:prompt("Image URL (optional):")||""});save();render()}
function editPortfolio(i){let x=state.portfolio[i];x.name=prompt("Name:",x.name)||x.name;x.description=prompt("Description:",x.description)||x.description;x.image=prompt("Image URL:",x.image)||"";save();render()}
function deletePortfolio(i){state.portfolio.splice(i,1);save();render()}
function resetAll(){if(confirm("Reset all dashboard data?")){localStorage.removeItem("maddisonNotionDashboard");location.reload()}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="maddison-dashboard-backup.json";a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();location.reload()}catch{alert("That backup is not valid JSON.")}};r.readAsText(f)}
function showPage(id){currentPage=id;render();updateClock();window.scrollTo({top:0,behavior:"smooth"})}
function updateClock(){let d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0"),ampm=h>=12?"PM":"AM";let c=document.getElementById("clock");if(c)c.textContent=`${String(h%12||12).padStart(2,"0")}:${m} ${ampm}`;let dt=document.getElementById("date");if(dt)dt.textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
applySettings();render();updateClock();setInterval(updateClock,30000);
</script>
</body>
</html>
